:root {

  --accent: #9b1c2c;

html[data-theme="dark"] {
  --bg: #14171d;
  --fg: #edf1f7;

  --shadow: 0 4px 14px rgba(0, 0, 0, 0.40);

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
}

#app {
  position: fixed;
  left: 0;
  top: 0;
  width: 1600px;
  height: 900px;
  transform-origin: 0 0;
  pointer-events: none;
  z-index: 10;
}

#app.is-hidden {
  display: none;
}

.vp {
  position: absolute;
  inset: 0;
  pointer-events: none;
  color: var(--fg);
}

.vp .haze {
