:root {
  --bg: #f6f7f9;
  --fg: #14181f;
  --fg-muted: #556070;
  --fg-dim: #8a95a5;
  --accent: #9b1c2c;
  --accent-soft: #fdf2f4;
  --accent-ink: #7d1322;
  --accent-glow: rgba(155, 28, 44, 0.14);
  --haze-a: rgba(155, 28, 44, 0.08);
  --haze-b: rgba(37, 75, 140, 0.07);
  --dots: rgba(20, 24, 31, 0.18);
  --card-bg: rgba(255, 255, 255, 0.92);
  --border: #e1e6ed;
  --track: #dfe5ee;
  --pill-bg: #ffffff;
  --pill-hover: #f3f5f8;
  --lab-bg: rgba(255, 255, 255, 0.96);
  --shadow: 0 2px 6px rgba(15, 23, 42, 0.05), 0 8px 20px rgba(15, 23, 42, 0.06);
}

html[data-theme="dark"] {
  --bg: #14171d;
  --fg: #edf1f7;
  --fg-muted: #a2adbd;
  --fg-dim: #657183;
  --accent: #d4485c;
  --accent-soft: rgba(212, 72, 92, 0.16);

  --accent-glow: rgba(212, 72, 92, 0.24);
  --haze-a: rgba(212, 72, 92, 0.12);
  --haze-b: rgba(70, 120, 210, 0.10);
  --dots: rgba(237, 241, 247, 0.14);
  --card-bg: rgba(22, 26, 34, 0.92);
  --border: rgba(237, 241, 247, 0.15);
  --track: rgba(237, 241, 247, 0.16);
  --pill-bg: rgba(26, 31, 41, 0.94);
  --pill-hover: rgba(38, 45, 58, 0.98);
  --lab-bg: rgba(22, 26, 34, 0.95);
  --shadow: 0 4px 14px rgba(0, 0, 0, 0.40);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
}

#app {
  position: fixed;
  left: 0;
  top: 0;
  width: 1600px;
  height: 900px;
  transform-origin: 0 0;
  pointer-events: none;
  z-index: 10;
}

#app.is-hidden {
  display: none;
}

.vp {
  position: absolute;
  inset: 0;
  pointer-events: none;
  color: var(--fg);
}

.vp .haze {
  position: absolute;

  width: 7px;
  height: 7px;
