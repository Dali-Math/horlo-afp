}

}

}

  pointer-events: none;

    radial-gradient(540px 360px at 70px -30px, var(--haze-a), transparent 72%),
    radial-gradient(620px 420px at 1590px 10px, var(--haze-b), transparent 72%);
}

.vp .dots {
  position: absolute;
  right: 0;
  top: 0;
  width: 400px;
  height: 280px;
  opacity: 0.45;
  pointer-events: none;
  background-image: radial-gradient(var(--dots) 1px, transparent 1.4px);
  background-size: 9px 9px;
  -webkit-mask-image: radial-gradient(350px 230px at 100% 0%, #000, transparent 76%);
  mask-image: radial-gradient(350px 230px at 100% 0%, #000, transparent 76%);
}

.vp .logo {
  position: absolute;
  left: 44px;
  top: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  font: 700 18px/1 Georgia, "Times New Roman", serif;
  letter-spacing: 0.03em;
}

.vp .logo i {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  position: relative;
  display: block;
}

.vp .logo i:after {
  content: '';
  position: absolute;
  left: 6px;
  top: 6px;
  width: 12px;
  height: 12px;
  border: 2px solid var(--fg);
  border-radius: 50%;
  border-right-color: transparent;
}

.vp .top-left {
  position: absolute;
  left: 198px;
  top: 22px;
  display: flex;
  align-items: center;
  gap: 7px;
  pointer-events: auto;
}

.vp .top-right {
  position: absolute;
  right: 36px;
  top: 22px;
  display: flex;
  align-items: center;
  gap: 7px;
  pointer-events: auto;
}

.vp .ctrl-chip {
  height: 31px;
  padding: 0 11px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--pill-bg);
  color: var(--fg);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 11.5px/1 inherit;
  cursor: pointer;
  user-select: none;
  transition: transform 90ms cubic-bezier(0.22, 1, 0.36, 1);
}

.vp .ctrl-chip:hover { background: var(--pill-hover); }
.vp .ctrl-chip:active { transform: scale(0.95); }

.vp .ctrl-chip.is-on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.vp .ctrl-chip b {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--fg-dim);
  display: block;
}

.vp .ctrl-chip.is-on b {
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-glow);
}

.vp .head {
  position: absolute;
  left: 0;
  right: 0;
  top: 44px;
  text-align: center;
  pointer-events: none;
}

.vp .head .ver {
  font: 700 18px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-muted);
}

.vp .head .ver em {
  font-style: normal;
  color: var(--accent);
}

.vp .head h1 {
  margin: 8px 0 0;
  font: 700 32px/1.08 Georgia, "Times New Roman", serif;
  letter-spacing: -0.01em;
  color: var(--fg);
}

.vp .head .rule {
  width: 92px;
  height: 3px;
  border-radius: 3px;
  margin: 10px auto 0;
  background: linear-gradient(90deg, transparent, var(--accent) 30%, var(--accent) 70%, transparent);
}

.vp .head .date {
  margin-top: 8px;
  font: 500 12.5px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: var(--fg-muted);
}

.vp .pills {
  position: absolute;
  left: 0;
  right: 0;
  top: 162px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  pointer-events: auto;
}

.vp .pill {
  height: 33px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--pill-bg);
  color: var(--fg);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font: 600 12.5px/1 inherit;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  transition: transform 90ms cubic-bezier(0.22, 1, 0.36, 1);
}

.vp .pill:hover { background: var(--pill-hover); }
.vp .pill:active { transform: scale(0.95); }

.vp .pill i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--fg-dim);
  display: block;
  position: relative;
}

.vp .pill i:after {
  content: '';
  position: absolute;
  left: 4px;
  top: 2.5px;
  border-left: 4.5px solid var(--fg-dim);
  border-top: 3px solid transparent;
  border-bottom: 3px solid transparent;
}

.vp .pill.on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.vp .pill.on i { border-color: var(--accent); }
.vp .pill.on i:after { border-left-color: var(--accent); }

.vp .nav {
  position: absolute;
  left: 44px;
  top: 256px;
  width: 215px;
  border-left: 1.5px solid var(--border);
  pointer-events: auto;
}

.vp .nav-item {
  position: relative;
  padding: 7px 6px 7px 16px;
  font: 500 13.5px/1.25 inherit;
  color: var(--fg-dim);
  cursor: pointer;
  user-select: none;
}

.vp .nav-item:hover {
  color: var(--fg-muted);
}

.vp .nav-item.on {
  color: var(--fg);
  font-weight: 700;
}

.vp .nav-item.on:before {
  content: '';
  position: absolute;
  left: -2px;
  top: 6px;
  bottom: 6px;
  width: 3px;
  border-radius: 2px;
  background: var(--accent);
}

.vp .nav-sub {
  padding: 3px 0 3px 26px;
  font: 500 11.5px/1.25 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: var(--fg-muted);
}

.vp .ortho-box {
  position: absolute;
  left: 44px;
  bottom: 70px;
  width: 215px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: auto;
}

/* Clear parent fixed action buttons (left-6 bottom-6) when embedded inside HorloLearn iframe */
html.horlo-embedded .vp .ortho-box {
  left: var(--horlo-ortho-left, 158px);
  bottom: 84px;
  width: 215px;
}

.vp .ortho-title {
  font: 600 10px/1 inherit;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-dim);
}

.vp .ortho-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}

.vp .ortho-btn {
  height: 27px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--pill-bg);
  color: var(--fg);
  font: 500 10.5px/1 inherit;
  white-space: nowrap;
  cursor: pointer;
}

.vp .ortho-btn:hover { background: var(--pill-hover); }
.vp .ortho-btn.on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.vp .cards {
  position: absolute;
  left: 1330px;
  top: 252px;
  width: 226px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  pointer-events: none;
}

.vp .card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
}

.vp .card .k {
  font: 600 10.5px/1 inherit;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-muted);
}

.vp .card .v {
  margin-top: 7px;
  font: 700 24px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
}

.vp .card .v small {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--fg-muted);
  margin-left: 4px;
}

.vp .card .subnote {
  margin-top: 6px;
  font: 500 10.5px/1.3 inherit;
  color: var(--fg-muted);
}

.vp .card svg {
  display: block;
  margin-top: 7px;
}

.vp .bar {
  height: 6px;
  border-radius: 3px;
  background: var(--track);
  margin-top: 9px;
  overflow: hidden;
}

.vp .bar b {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
}

.vp .layers {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  height: 44px;
  margin-top: 9px;
}

.vp .layers b {
  flex: 1;
  background: var(--accent);
  border-radius: 3px 3px 1px 1px;
  opacity: 0.88;
}

.vp .foot {
  position: absolute;
  left: 274px;
  right: 266px;
  top: 848px;
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: auto;
}

.vp .foot .st {
  height: 28px;
  padding: 0 12px;
  border-radius: 14px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font: 600 12px/28px inherit;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 7px;
}

.vp .foot .st b {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  display: block;
}

.vp .foot .track {
  flex: 1;
  height: 18px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
}

.vp .foot .track-bg {
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--track);
  position: relative;
  overflow: hidden;
}

.vp .foot .track-bg b {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  background: var(--accent);
  border-radius: 2px;
}

.vp .foot .tm {
  font: 600 12px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: var(--fg-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.vp svg.lines {
  position: absolute;
  left: 0;
  top: 0;
  width: 1600px;
  height: 900px;
  overflow: visible;
  pointer-events: none;
}

.vp .labs {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.vp .lab {
  position: absolute;
  padding: 7px 11px;
  background: var(--lab-bg);
  border: 1px solid var(--border);
  border-radius: 9px;
  box-shadow: var(--shadow);
  white-space: nowrap;
}

.vp .lab b {
  display: block;
  font: 700 12.5px/1.2 inherit;
  color: var(--fg);
}

.vp .lab span {
  display: block;
  margin-top: 2px;
  font: 500 11px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: var(--fg-muted);
}
