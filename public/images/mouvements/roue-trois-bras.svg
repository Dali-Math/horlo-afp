<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients & Effets Horlogerie Suisse -->
    <radialGradient id="brassGradient" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="85%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>
    <radialGradient id="steelGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="chamferLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond technique d'établi horloger -->
  <rect width="800" height="600" fill="#090D16" rx="16"/>
  
  <!-- Grille micrométrique de précision (pas 20px) -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="0.5">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
      <circle cx="20" cy="20" r="1" fill="#38BDF8"/>
    </pattern>
    <rect width="800" height="600" fill="url(#grid)"/>
  </g>

  <!-- Cartouche titre technique officiel -->
  <g transform="translate(40, 40)">
    <rect width="360" height="56" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="16" y="24" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">ROUE DES SECONDES À 3 BRAS</text>
    <text x="16" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Norme NIHS 20-25 • Allègement d'inertie du finissage • 120°</text>
  </g>

  <!-- Repères angulaires & Lignes de construction (120°) -->
  <g transform="translate(400, 310)" stroke="#0284C7" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <circle cx="0" cy="0" r="230" fill="none"/>
    <circle cx="0" cy="0" r="150" fill="none"/>
    <line x1="0" y1="-250" x2="0" y2="250"/>
    <line x1="-216.5" y1="125" x2="216.5" y2="-125"/>
    <line x1="-216.5" y1="-125" x2="216.5" y2="125"/>
  </g>

  <!-- Roue principale (Centre x:400, y:310) -->
  <g transform="translate(400, 310)" filter="url(#subtleShadow)">
    
    <!-- Denture périphérique (80 dents de seconde simulées) -->
    <g id="gearTeeth">
      <!-- Cercle primitif et serge extérieure -->
      <circle cx="0" cy="0" r="195" fill="url(#brassGradient)" stroke="#A16207" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="172" fill="#090D16"/>
    </g>

    <!-- Évidements ajourés (3 grandes fenêtres à 120°) délimitant les 3 bras -->
    <!-- Bras 1 vers le haut (-90°), Bras 2 à 30°, Bras 3 à 150° -->
    <g fill="#090D16" stroke="url(#chamferLight)" stroke-width="2">
      <!-- Fenêtre 1 (entre bras haut et bras bas-droit) -->
      <path d="M 28,-48 
               A 55,55 0 0,1 48,28 
               L 150,86 
               A 172,172 0 0,0 86,-150 
               Z"/>
      <!-- Fenêtre 2 (entre bras bas-droit et bras bas-gauche) -->
      <path d="M 0,55 
               A 55,55 0 0,1 -48,28 
               L -150,86 
               A 172,172 0 0,0 0,172 
               Z" transform="rotate(120)"/>
      <!-- Fenêtre 3 (entre bras bas-gauche et bras haut) -->
      <path d="M 0,55 
               A 55,55 0 0,1 -48,28 
               L -150,86 
               A 172,172 0 0,0 0,172 
               Z" transform="rotate(240)"/>
    </g>

    <!-- Serge extérieure intérieure et chanfrein d'allègement -->
    <circle cx="0" cy="0" r="172" fill="none" stroke="#CA8A04" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#FEF08A" stroke-width="0.75" opacity="0.6"/>

    <!-- Noyau / Moyeu central en laiton -->
    <circle cx="0" cy="0" r="55" fill="url(#brassGradient)" stroke="#854D0E" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FEF08A" stroke-width="1" opacity="0.8"/>

    <!-- Pignon central en acier trempé & poli miroir -->
    <circle cx="0" cy="0" r="28" fill="url(#steelGradient)" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Trou de pivot central poli & huilage -->
    <circle cx="0" cy="0" r="12" fill="#0B132B" stroke="#64748B" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#0284C7"/>
  </g>

  <!-- Denture extérieure détaillée (crénelage stylisé haute précision) -->
  <g transform="translate(400, 310)" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round">
    <!-- Génération de repères de dents tous les 15° -->
    <line x1="0" y1="-195" x2="0" y2="-204"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(15)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(30)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(45)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(60)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(75)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(90)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(105)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(120)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(135)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(150)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(165)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(180)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(195)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(210)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(225)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(240)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(255)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(270)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(285)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(300)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(315)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(330)"/>
    <line x1="0" y1="-195" x2="0" y2="-204" transform="rotate(345)"/>
  </g>

  <!-- Cotations & Légendes micro-techniques -->
  <!-- 1. Cotation Serge -->
  <g transform="translate(610, 220)">
    <line x1="0" y1="0" x2="-35" y2="35" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="-35" cy="35" r="3" fill="#38BDF8"/>
    <rect x="5" y="-12" width="165" height="42" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="14" y="6" fill="#38BDF8" font-family="system-ui" font-size="11" font-weight="700">1. SERGE (Jante dentée)</text>
    <text x="14" y="22" fill="#94A3B8" font-family="system-ui" font-size="10">Profil cycloïdal NIHS 20-25</text>
  </g>

  <!-- 2. Cotation Bras à 120° -->
  <g transform="translate(610, 360)">
    <line x1="0" y1="0" x2="-75" y2="-20" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="-75" cy="-20" r="3" fill="#F59E0B"/>
    <rect x="5" y="-12" width="165" height="42" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="14" y="6" fill="#F59E0B" font-family="system-ui" font-size="11" font-weight="700">2. BRAS ÉVIDÉS (3×120°)</text>
    <text x="14" y="22" fill="#94A3B8" font-family="system-ui" font-size="10">Inertie réduite de -40%</text>
  </g>

  <!-- 3. Cotation Noyau / Pignon -->
  <g transform="translate(30, 480)">
    <line x1="200" y1="-30" x2="350" y2="-150" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="350" cy="-150" r="3" fill="#10B981"/>
    <rect x="20" y="-45" width="200" height="46" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="30" y="-27" fill="#10B981" font-family="system-ui" font-size="11" font-weight="700">3. NOYAU &amp; PIGNON ACIER</text>
    <text x="30" y="-11" fill="#94A3B8" font-family="system-ui" font-size="10">Chassage à serrage • Pignon poli</text>
  </g>

  <!-- Badge Norme Suisse -->
  <g transform="translate(40, 545)">
    <rect width="180" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="13" r="5" fill="#EF4444"/>
    <path d="M 15 10 L 15 16 M 12 13 L 18 13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="28" y="17" fill="#E2E8F0" font-family="system-ui" font-size="10" font-weight="600">HORLOGERIE SUISSE • NIHS</text>
  </g>
</svg>
