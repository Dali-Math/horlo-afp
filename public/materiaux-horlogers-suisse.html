<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matériaux Horlogers Suisses - Excellence</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- ✅ PATCH POUR IGNORER LE STYLE GLOBAL HORLOLEARN -->
  <style>
    html, body {
      all: unset;
      all: revert;
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
    }
  </style>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --mh-red: #DC143C;
      --mh-white: #FFFFFF;
      --mh-gray-50: #f9fafb;
      --mh-gray-200: #e5e7eb;
      --mh-gray-800: #1f2937;
      --mh-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    body { font-family: 'Inter', sans-serif; line-height: 1.6; color: var(--mh-gray-800); background: var(--mh-white); }
    .mh-container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    
    /* HERO */
    .mh-hero {
      background: linear-gradient(135deg, var(--mh-red) 0%, #b91c3c 100%);
      color: white;
      padding: 4rem 0;
      text-align: center;
    }
    .mh-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 1rem;
    }
    .mh-hero .mh-subtitle {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    .mh-hero p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 2rem;
      opacity: 0.9;
    }
    .mh-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin: 2rem 0;
    }
    .mh-stat {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .mh-stat-number {
      display: block;
      font-size: 2.5rem;
      font-weight: 900;
      font-family: 'Playfair Display', serif;
      color: var(--mh-white);
    }
    .mh-stat-label {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 0.5rem;
    }
    
    /* NAVIGATION */
    .mh-navigation {
      background: white;
      padding: 1.5rem 0;
      box-shadow: var(--mh-shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .mh-nav-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .mh-tab-btn {
      padding: 0.8rem 1rem;
      background: var(--mh-gray-50);
      border: 2px solid var(--mh-gray-200);
      border-radius: 12px;
      font-weight: 600;
      color: var(--mh-gray-800);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }
    .mh-tab-btn:hover, .mh-tab-btn.active {
      background: var(--mh-red);
      color: white;
      border-color: var(--mh-red);
      transform: translateY(-2px);
    }
    
    /* SECTIONS */
    .mh-section { padding: 3rem 0; display: none; }
    .mh-section.active { display: block; }
    .mh-section-header { text-align: center; margin-bottom: 2rem; }
    .mh-section-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--mh-red);
      margin-bottom: 1rem;
    }
    .mh-section-divider {
      width: 80px;
      height: 4px;
      background: var(--mh-red);
      margin: 0 auto;
      border-radius: 2px;
    }
    
    /* GRIDS */
    .mh-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
    .mh-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .mh-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    
    /* CARDS */
    .mh-card {
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: var(--mh-shadow);
      border: 1px solid var(--mh-gray-200);
      transition: all 0.3s ease;
    }
    .mh-card:hover { transform: translateY(-3px); }
    .mh-card h3, .mh-card h4 {
      color: var(--mh-red);
      margin-bottom: 0.5rem;
      font-family: 'Playfair Display', serif;
    }
    .mh-company-logo {
      width: 50px;
      height: 50px;
      background: var(--mh-red);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    
    /* IMAGES */
    .mh-image {
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: var(--mh-shadow);
      transition: all 0.3s ease;
    }
    .mh-image:hover { transform: scale(1.02); }
    
    /* LISTS */
    .mh-list { list-style: none; padding: 0; }
    .mh-list li {
      padding: 0.3rem 0;
      position: relative;
      padding-left: 1rem;
    }
    .mh-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--mh-red);
      font-weight: bold;
    }
    
    /* TAGS */
    .mh-tag {
      display: inline-block;
      background: var(--mh-red);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 500;
      margin: 0.2rem 0.4rem 0.2rem 0;
    }
    
    /* TIMELINE */
    .mh-timeline-item {
      background: var(--mh-gray-50);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      border-left: 4px solid var(--mh-red);
    }
    .mh-timeline-year {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--mh-red);
      margin-bottom: 0.5rem;
    }
    
    /* ANIMATIONS SIMPLIFIÉES */
    @keyframes mhFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .mh-reveal { opacity: 0; transition: all 0.5s ease; }
    .mh-reveal.revealed { opacity: 1; }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      .mh-grid-2, .mh-grid-3, .mh-grid-4 { grid-template-columns: 1fr; }
      .mh-nav-tabs { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .mh-nav-tabs { grid-template-columns: 1fr; }
    }
  </style>
</head>
