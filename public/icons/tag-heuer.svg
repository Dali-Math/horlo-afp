<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- TAG Heuer Shield -->
  <g transform="translate(100, 22) scale(0.8)">
    <!-- Top TAG section (Green) -->
    <path d="M-22,-14 L22,-14 L22,-2 L-22,-2 Z" fill="#006633" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'Arial', sans-serif" font-size="9" font-weight="900" letter-spacing="2">TAG</text>
    <!-- Bottom HEUER section (Red Shield) -->
    <path d="M-22,-2 L22,-2 L22,7 L0,18 L-22,7 Z" fill="#D32F2F" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-family="'Arial', sans-serif" font-size="8.5" font-weight="900" letter-spacing="1.5">HEUER</text>
  </g>
  <text x="100" y="55" text-anchor="middle" fill="#FFFFFF" font-family="'Montserrat', 'Arial', sans-serif" font-size="14.5" font-weight="800" letter-spacing="3">TAG HEUER</text>
  <text x="100" y="68" text-anchor="middle" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="7" font-weight="600" letter-spacing="3">SWISS AVANT-GARDE 1860</text>
</svg>